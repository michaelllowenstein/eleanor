services:
  postgres:
    image: postgres:17
    container_name: eleanor-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: eleanor
      POSTGRES_USER: eleanor
      POSTGRES_PASSWORD: eleanor
    ports:
      - "5432:5432"
    volumes:
      - eleanor-postgres:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U eleanor -d eleanor"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    container_name: eleanor-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - eleanor-redis:/data
    command:
      [
        "redis-server",
        "--appendonly",
        "yes"
      ]
    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "ping"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  eleanor-postgres:
  eleanor-redis:
