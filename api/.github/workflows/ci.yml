name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API — build, unit + migration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: eleanor_test
          POSTGRES_USER: eleanor
          POSTGRES_PASSWORD: eleanor
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U eleanor -d eleanor_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --workspace @eleanor/api --no-audit --no-fund
      - run: npm run build --workspace @eleanor/api
      - run: npm test --workspace @eleanor/api
        env:
          # Disposable database: the integration suite drops the public schema.
          TEST_DATABASE_URL: postgresql://eleanor:eleanor@localhost:5432/eleanor_test

  client:
    name: Client — production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --workspace @eleanor/client --legacy-peer-deps --no-audit --no-fund
      - run: npm run build:prod --workspace @eleanor/client

  image:
    name: API image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --target runtime -t eleanor-api:ci .

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
