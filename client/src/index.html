<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Eleanor</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
    <style>
    :root {
      color-scheme: dark;
      font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      background:
        radial-gradient(
          circle at center,
          #10294a 0%,
          #07111f 38%,
          #02060c 75%
        );
      color: #eef7ff;
    }

    .app {
      width: min(900px, calc(100vw - 32px));
      min-height: 640px;
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: 32px;
      padding: 32px;
      border: 1px solid rgba(144, 210, 255, 0.2);
      border-radius: 28px;
      background: rgba(3, 12, 24, 0.74);
      box-shadow:
        0 32px 100px rgba(0, 0, 0, 0.45),
        inset 0 0 80px rgba(80, 174, 255, 0.03);
      backdrop-filter: blur(24px);
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .identity h1 {
      margin: 0;
      letter-spacing: 0.22em;
      font-size: 1.2rem;
      font-weight: 600;
    }

    .identity p {
      margin: 7px 0 0;
      color: #8294aa;
      font-size: 0.86rem;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 9px;
      color: #8da6bf;
      font-size: 0.76rem;
      letter-spacing: 0.16em;
    }

    .status-dot {
      width: 9px;
      height: 9px;
      border-radius: 999px;
      background: #677484;
    }

    .status[data-state="connecting"] .status-dot {
      background: #ffca65;
      box-shadow: 0 0 14px #ffca65;
    }

    .status[data-state="online"] .status-dot {
      background: #6de6ff;
      box-shadow: 0 0 14px #6de6ff;
    }

    .status[data-state="error"] .status-dot {
      background: #ff6f7d;
      box-shadow: 0 0 14px #ff6f7d;
    }

    main {
      display: grid;
      place-items: center;
      gap: 34px;
    }

    .orb-shell {
      position: relative;
      width: 290px;
      aspect-ratio: 1;
      display: grid;
      place-items: center;
    }

    .orb-ring {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 1px solid rgba(112, 212, 255, 0.22);
      animation: rotate 14s linear infinite;
    }

    .orb-ring::before,
    .orb-ring::after {
      position: absolute;
      content: "";
      border-radius: inherit;
      border: inherit;
    }

    .orb-ring::before {
      inset: 20px;
      border-style: dashed;
    }

    .orb-ring::after {
      inset: 43px;
    }

    .orb {
      width: 145px;
      aspect-ratio: 1;
      border-radius: 50%;
      border: 1px solid rgba(148, 226, 255, 0.6);
      background:
        radial-gradient(
          circle at 38% 35%,
          rgba(228, 250, 255, 0.95),
          rgba(92, 205, 255, 0.58) 14%,
          rgba(26, 121, 203, 0.34) 42%,
          rgba(3, 20, 38, 0.82) 72%
        );
      box-shadow:
        0 0 20px rgba(72, 198, 255, 0.6),
        0 0 90px rgba(72, 198, 255, 0.26),
        inset 0 0 50px rgba(116, 221, 255, 0.34);
      transition:
        transform 180ms ease,
        filter 180ms ease;
    }

    .online .orb {
      animation: breathe 2.2s ease-in-out infinite;
    }

    .assistant-state {
      text-align: center;
    }

    .assistant-state strong {
      display: block;
      margin-bottom: 10px;
      font-size: 1.3rem;
      font-weight: 500;
    }

    .assistant-state span {
      color: #8194aa;
      font-size: 0.9rem;
    }

    .controls {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    button {
      appearance: none;
      min-width: 160px;
      padding: 13px 20px;
      border: 1px solid rgba(137, 209, 255, 0.28);
      border-radius: 999px;
      background: rgba(61, 156, 218, 0.09);
      color: #dff6ff;
      font: inherit;
      cursor: pointer;
      transition:
        border-color 160ms ease,
        background 160ms ease,
        transform 160ms ease;
    }

    button:hover:not(:disabled) {
      border-color: rgba(137, 209, 255, 0.65);
      background: rgba(61, 156, 218, 0.18);
      transform: translateY(-1px);
    }

    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .secondary {
      border-color: rgba(255, 255, 255, 0.12);
      background: rgba(255, 255, 255, 0.025);
      color: #98aabd;
    }

    details {
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      padding-top: 20px;
      color: #72859b;
    }

    summary {
      cursor: pointer;
      font-size: 0.82rem;
    }

    #events {
      max-height: 180px;
      overflow: auto;
      margin: 16px 0 0;
      padding: 16px;
      border-radius: 12px;
      background: rgba(0, 0, 0, 0.2);
      color: #82a1bd;
      font-family:
        "SFMono-Regular",
        Consolas,
        monospace;
      font-size: 0.72rem;
      line-height: 1.55;
      white-space: pre-wrap;
    }

    @keyframes breathe {
      0%,
      100% {
        transform: scale(1);
        filter: brightness(0.92);
      }

      50% {
        transform: scale(1.08);
        filter: brightness(1.15);
      }
    }

    @keyframes rotate {
      to {
        transform: rotate(360deg);
      }
    }

    @media (max-width: 600px) {
      .app {
        min-height: calc(100vh - 24px);
        padding: 24px 18px;
      }

      .orb-shell {
        width: 230px;
      }

      .orb {
        width: 120px;
      }
    }
  </style>
</head>
<body>
  <app-root></app-root>
</body>
</html>
